# /etc/nginx/business/counttech.cloud/company-website.conf
# Existing shared images route is retained for other services.
location /images/ {
    alias /srv/www/images/;
    autoindex off;
}

location / {
    root /srv/www/company-website;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
