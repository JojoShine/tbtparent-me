# /etc/nginx/business/counttech.cloud/project-manager.conf
# Static notice maintained on the host, independently of the application image.
location = /project-manager {
    return 302 /project-manager/;
}

location ^~ /project-manager/ {
    # Retired API/form submissions must never reach the old service or new site.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 410;
    }
    root /srv/www;
    try_files /project-manager-retired.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, follow" always;
}
