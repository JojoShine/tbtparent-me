<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>项目管理服务已更新 · FlowCraft</title>
  <style>
    :root { color-scheme: light; --bg: #f6f5f1; --fg: #232722; --muted: #62685f; --line: #d7dad2; --accent: #31563b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: 32px 24px; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; display: grid; place-items: center; }
    main { width: min(100%, 560px); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 650; letter-spacing: -.4px; }
    .mark { color: var(--accent); width: 28px; height: 28px; }
    .eyebrow { margin: 64px 0 20px; color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .12em; }
    h1 { font-size: clamp(29px, 6vw, 42px); line-height: 1.3; letter-spacing: -.04em; margin: 0 0 22px; font-weight: 650; }
    .intro { color: var(--muted); font-size: 16px; line-height: 1.9; margin: 0; max-width: 490px; }
    .destination { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 22px 0; margin: 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .destination strong { display: block; font-size: 17px; margin-bottom: 6px; }
    .destination small { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .arrow { font-size: 26px; color: var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    a, button { font: inherit; border-radius: 6px; min-height: 46px; padding: 12px 20px; text-decoration: none; cursor: pointer; font-size: 14px; }
    .primary { color: var(--bg); background: var(--accent); font-weight: 600; display: inline-flex; gap: 24px; align-items: center; }
    button { background: transparent; border: 1px solid var(--line); color: var(--fg); }
    a:hover, button:hover { filter: brightness(.9); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .timing { margin-top: 30px; }
    .status { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    progress { display: block; width: 100%; height: 3px; border: 0; border-radius: 0; background: var(--line); color: var(--accent); accent-color: var(--accent); }
    progress::-webkit-progress-bar { background: var(--line); }
    progress::-webkit-progress-value { background: var(--accent); }
    progress::-moz-progress-bar { background: var(--accent); }
    footer { margin-top: 54px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg: #191d19; --fg: #e6e9e2; --muted: #adb4a8; --line: #3c453b; --accent: #b1cba7; }
    }
    @media (max-width: 420px) {
      body { padding: 32px 22px; }
      .eyebrow { margin-top: 44px; }
      .intro { font-size: 15px; }
      footer { margin-top: 38px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <header class="brand">
      <svg class="mark" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 6h18M5 14h13M5 22h8M18 10l5 4-5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      FlowCraft
    </header>
    <p class="eyebrow">服务更新通知</p>
    <h1 id="title">旧服务已停用，<br>下一步，前往 FlowCraft。</h1>
    <p class="intro">原项目管理系统已停止服务。你可以前往 FlowCraft，继续安排任务、梳理进度，让项目有序推进。</p>
    <div class="destination">
      <div><strong>新的项目管理入口</strong><small>tbtparent.me/flowcraft/</small></div>
      <span class="arrow" aria-hidden="true">↗</span>
    </div>
    <div class="actions">
      <a class="primary" href="https://tbtparent.me/flowcraft/" rel="noreferrer">立即前往 FlowCraft <span aria-hidden="true">→</span></a>
      <button id="pause" type="button" hidden aria-pressed="false">暂停跳转</button>
    </div>
    <div class="timing" id="timing" hidden>
      <p class="status" id="redirect-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <progress id="progress" max="5" value="0" aria-label="自动跳转进度"></progress>
    </div>
    <noscript><p class="status" style="margin-top:24px">点击上方按钮即可前往 FlowCraft。</p></noscript>
    <footer>建议收藏新的入口，方便下次直接访问。<br>感谢你对原项目的使用与支持。</footer>
  </main>
  <script>
    const status = document.getElementById('redirect-status');
    const pause = document.getElementById('pause');
    const progress = document.getElementById('progress');
    let remaining = 5;
    let paused = false;
    function render() {
      status.textContent = paused ? '已暂停自动跳转，你可以随时继续或点击上方按钮。' : `${remaining} 秒后自动前往 FlowCraft`;
      pause.textContent = paused ? '继续跳转' : '暂停跳转';
      pause.setAttribute('aria-pressed', String(paused));
      progress.value = 5 - remaining;
    }
    pause.hidden = false;
    document.getElementById('timing').hidden = false;
    pause.addEventListener('click', () => { paused = !paused; render(); });
    render();
    const timer = setInterval(() => {
      if (paused) return;
      remaining--;
      render();
      if (remaining === 0) {
        clearInterval(timer);
        window.location.replace('https://tbtparent.me/flowcraft/');
      }
    }, 1000);
  </script>
</body>
</html>
